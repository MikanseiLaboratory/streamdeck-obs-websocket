name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write

env:
  PLUGIN_ID: dev.mikanseilaboratory.obs.websocket
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo test --workspace
      - run: npm ci
        working-directory: pi
      - run: npm run build
        working-directory: pi
      - uses: actions/upload-artifact@v4
        with:
          name: property-inspector
          path: plugin/dev.mikanseilaboratory.obs.websocket.sdPlugin/propertyinspector

  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: win-x64
            binary: plugin.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: osx-arm64
            binary: plugin
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: osx-x64
            binary: plugin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p multiobs-plugin --release --bin plugin --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  package:
    needs: binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: build
      - name: Assemble plugin
        run: |
          set -euo pipefail
          plugin="plugin/${PLUGIN_ID}.sdPlugin"
          mkdir -p "$plugin/bin" "$plugin/propertyinspector"
          cp "build/win-x64/plugin.exe" "$plugin/bin/plugin.exe"
          lipo -create \
            "build/osx-arm64/plugin" \
            "build/osx-x64/plugin" \
            -output "$plugin/bin/plugin"
          chmod +x "$plugin/bin/plugin"
          cp -R build/property-inspector/. "$plugin/propertyinspector/"
      - name: Install Stream Deck CLI
        run: npm install -g @elgato/cli@1.9.0
      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-(alpha|beta|rc)\.([0-9]+)$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported tag: $tag" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
      - name: Pack official plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          streamdeck pack \
            --no-update-check \
            --force \
            --output dist \
            --version "${{ steps.meta.outputs.version }}" \
            "plugin/${PLUGIN_ID}.sdPlugin"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          file="dist/${PLUGIN_ID}.streamDeckPlugin"
          args=(release create "$tag" "$file" --title "$tag" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
