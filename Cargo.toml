[workspace]
resolver = "2"
members = ["crates/obs-pool", "crates/multiobs-plugin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
obs-websocket = { git = "https://github.com/MikanseiLaboratory/obs-websocket-rs", rev = "8fe8125ffa23e67c76741c3bfdb74b52a3a7e907", default-features = false }
obs-websocket-core = { git = "https://github.com/MikanseiLaboratory/obs-websocket-rs", rev = "8fe8125ffa23e67c76741c3bfdb74b52a3a7e907" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
